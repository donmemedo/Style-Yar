services:
  backend:
    build: ./backend
    container_name: lookyab-api
    ports: ["8054:8054"]
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: /api
    container_name: lookyab-web
    ports: ["3054:3054"]
    environment:
      API_INTERNAL_URL: http://backend:8054
      NEXT_PUBLIC_API_BASE: /api
      PORT: "3054"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
